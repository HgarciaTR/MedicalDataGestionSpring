<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medical Data Gestión | Editar medicamento</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #e9eef5;
            font-family: Arial, Helvetica, sans-serif;
        }

        .contenedor {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.20);
        }

        h1 {
            text-align: center;
            color: #1565C0;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #cccccc;
            box-sizing: border-box;
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #1976D2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
        }

        input[type="submit"]:hover {
            background: #0D47A1;
        }

        .volver {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #1976D2;
            text-decoration: none;
        }

        /* Estilos de la información del registro. */
        .informacion-registro {
            margin-bottom: 20px;
            padding: 15px;
            background: #f4f7fb;
            border-radius: 6px;
            color: #555555;
            border-left: 4px solid #1976D2;
        }

        .informacion-registro h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #1565C0;
            font-size: 16px;
        }

        .informacion-registro p {
            margin: 8px 0;
            font-size: 14px;
        }

        /* Estilos de los mensajes de advertencia. */
        .error {
            padding: 12px;
            margin-bottom: 20px;
            background: #FFEBEE;
            color: #C62828;
            border-radius: 5px;
        }

    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Editar medicamento</h1>

        <!-- Mostrar los mensajes de validación enviados por el Controller. -->
        <div class="error"
             th:if="${error != null}"
             th:text="${error}">
        </div>

        <!-- Información del usuario y las fechas del registro. -->
        <div class="informacion-registro">

            <h3>Información del registro</h3>

            <!-- Mostrar el usuario que registró originalmente el medicamento. -->
            <p>
                <strong>Usuario que registra:</strong>

                <span th:text="${medicamento.usuario != null ? medicamento.usuario.nombre + ' ' + medicamento.usuario.apellido : 'No disponible'}">
                </span>
            </p>

            <!-- Mostrar la fecha y hora de creación del registro. -->
            <p>
                <strong>Fecha de registro:</strong>

                <span th:text="${medicamento.fechaRegistro != null ? #temporals.format(medicamento.fechaRegistro, 'dd/MM/yyyy HH:mm') : 'No disponible'}">
                </span>
            </p>

            <!-- Mostrar la fecha y hora de la última modificación. -->
            <p>
                <strong>Última actualización:</strong>

                <span th:text="${medicamento.fechaActualizacion != null ? #temporals.format(medicamento.fechaActualizacion, 'dd/MM/yyyy HH:mm') : 'No disponible'}">
                </span>
            </p>

        </div>

        <!-- Formulario para actualizar un medicamento mediante POST. -->
        <form th:action="@{/medicamentos/actualizar}"
              th:object="${medicamento}"
              method="post">

            <!-- Mantener el identificador del medicamento durante la actualización. -->
            <input type="hidden"
                   th:field="*{idMedicamento}">

            <!-- Campo para modificar el nombre del medicamento. -->
            <label>Nombre del medicamento:</label>

            <input type="text"
                   th:field="*{nombreMedicamento}"
                   required>

            <!-- Campo para modificar la fecha de vencimiento. -->
            <label>Fecha de vencimiento:</label>

            <input type="date"
                   th:field="*{fechaVencimiento}"
                   required>

            <!-- Campo para modificar la descripción del medicamento. -->
            <label>Descripción:</label>

            <input type="text"
                   th:field="*{descripcion}">

            <!-- Botón para guardar los cambios. -->
            <input type="submit"
                   value="Actualizar medicamento">

        </form>

        <!-- Enlace para regresar al listado de medicamentos. -->
        <a class="volver" th:href="@{/medicamentos}">
            Volver a la lista
        </a>

    </div>

</body>
</html>
