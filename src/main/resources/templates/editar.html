<!DOCTYPE html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Editar medicamento</title>

    <style>

        body{

            margin:0;
            padding:0;
            background:#e9eef5;
            font-family:Arial, Helvetica, sans-serif;

        }

        .contenedor{

            width:500px;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 15px rgba(0,0,0,0.20);

        }

        h1{

            text-align:center;
            color:#1565C0;

        }

        label{

            font-weight:bold;

        }

        input[type=text],
        input[type=date],
        select{

            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border-radius:5px;
            border:1px solid #cccccc;
            box-sizing:border-box;

        }

        input[type=submit]{

            width:100%;
            padding:12px;
            background:#1976D2;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:15px;
            margin-top:10px;

        }

        input[type=submit]:hover{

            background:#0D47A1;

        }

        .volver{

            display:block;
            margin-top:15px;
            text-align:center;
            color:#1976D2;
            text-decoration:none;

        }

    </style>

</head>

<body>

<div class="contenedor">

    <h1>Editar medicamento</h1>

    <!-- Formulario para actualizar un medicamento mediante POST. -->
    <form th:action="@{/medicamentos/actualizar}"
          th:object="${medicamento}"
          method="post">

        <!-- Mantener el identificador del medicamento durante la actualización. -->
        <input type="hidden" th:field="*{idMedicamento}">

        <label>Nombre del medicamento:</label><br>

        <input type="text"
               th:field="*{nombreMedicamento}"
               required>

        <label>Fecha de vencimiento:</label><br>

        <input type="date"
               th:field="*{fechaVencimiento}"
               required>

        <label>Descripción:</label><br>

        <input type="text"
               th:field="*{descripcion}">

        <label>Usuario que registra:</label><br>

        <select th:field="*{usuario}" required>

            <option value="">
                Seleccione un usuario
            </option>

            <option th:each="usuario : ${usuarios}"
                    th:value="${usuario.idUsuario}"
                    th:text="${usuario.nombre + ' ' + usuario.apellido}">
            </option>

        </select>

        <!-- Botón para guardar los cambios. -->
        <input type="submit"
               value="Actualizar medicamento">

    </form>

    <a class="volver"
       th:href="@{/medicamentos}">
        Volver a la lista
    </a>

</div>

</body>

</html>
