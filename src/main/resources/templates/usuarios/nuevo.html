<!DOCTYPE html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Registrar usuario</title>

    <style>

        body{

            margin:0;
            padding:0;
            background:#e9eef5;
            font-family:Arial, Helvetica, sans-serif;

        }

        .contenedor{

            width:500px;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 15px rgba(0,0,0,0.20);

        }

        h1{

            text-align:center;
            color:#1565C0;

        }

        label{

            font-weight:bold;

        }

        input[type=text],
        input[type=email],
        input[type=password]{

            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border-radius:5px;
            border:1px solid #cccccc;
            box-sizing:border-box;

        }

        input[type=submit]{

            width:100%;
            padding:12px;
            background:#1976D2;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:15px;
            margin-top:10px;

        }

        input[type=submit]:hover{

            background:#0D47A1;

        }

        .boton{

            display:block;
            margin-top:15px;
            text-align:center;
            color:#1976D2;
            text-decoration:none;

        }

        .boton-panel{

            display:block;
            width:fit-content;
            margin:0 auto 20px auto;
            padding:10px 18px;
            background:#1976D2;
            color:white;
            text-decoration:none;
            border-radius:5px;

        }

        .boton-panel:hover{

            background:#0D47A1;

        }

    </style>

</head>

<body>

<div class="contenedor">

    <h1>Registrar usuario</h1>

    <a class="boton-panel"
       th:href="@{/panel}">
        Volver al panel
    </a>

    <form th:action="@{/usuarios/guardar}"
          th:object="${usuario}"
          method="post">

        <label>Nombre:</label><br>

        <input type="text"
               th:field="*{nombre}"
               required>

        <label>Apellido:</label><br>

        <input type="text"
               th:field="*{apellido}"
               required>

        <label>Correo:</label><br>

        <input type="email"
               th:field="*{correo}"
               required>

        <label>Contraseña:</label><br>

        <input type="password"
               th:field="*{contrasena}"
               required>

        <input type="submit"
               value="Guardar usuario">

    </form>

    <a class="boton"
       th:href="@{/usuarios}">
        Volver a usuarios
    </a>

</div>

</body>

</html>
