<!DOCTYPE html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Medical Data Gestión | Iniciar sesión</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            background: #e9eef5;
            font-family: Arial, Helvetica, sans-serif;
        }

        .contenedor {
            width: 420px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 0 18px rgba(0,0,0,0.18);
        }

        /* Estilo del logo de la aplicación. */
        .logo {
            display: block;
            width: 110px;
            height: auto;
            margin: 0 auto 15px auto;
        }

        .titulo {
            text-align: center;
            color: #1565C0;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #666666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input[type=email],
        input[type=password] {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        input[type=submit] {
            width: 100%;
            padding: 12px;
            background: #1976D2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        input[type=submit]:hover {
            background: #0D47A1;
        }

        .registro {
            display: block;
            width: fit-content;
            margin: 16px auto;
            padding: 10px 18px;
            background: #f4f7fb;
            color: #1565C0;
            text-decoration: none;
            border-radius: 6px;
        }

        .registro:hover {
            background: #e0e7f0;
        }

        .recuperar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1976D2;
            text-decoration: none;
        }

        .recuperar:hover {
            text-decoration: underline;
        }

        .error {
            margin-bottom: 18px;
            padding: 10px;
            background: #ffebee;
            color: #c62828;
            border-radius: 6px;
            text-align: center;
        }

        .mensaje {
            margin-bottom: 18px;
            padding: 10px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 6px;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="contenedor">

    <!-- Logo de Medical Data Gestión. -->
    <img class="logo"
         th:src="@{/imagenes/logo.png}"
         alt="Logo de Medical Data Gestión">

    <h1 class="titulo">
        Medical Data Gestión
    </h1>

    <p class="subtitulo">
        Iniciar sesión
    </p>

    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <div class="mensaje"
         th:if="${mensaje}"
         th:text="${mensaje}">
    </div>

    <form th:action="@{/login}"
          method="post">

        <label for="correo">
            Correo
        </label>

        <input type="email"
               id="correo"
               name="correo"
               placeholder="Ingrese su correo"
               required>

        <label for="contrasena">
            Contraseña
        </label>

        <input type="password"
               id="contrasena"
               name="contrasena"
               placeholder="Ingrese su contraseña"
               required>

        <input type="submit"
               value="Iniciar sesión">

    </form>

    <a class="registro"
       th:href="@{/registro}">
        Registrarse
    </a>

    <a class="recuperar"
       th:href="@{/recuperar}">
        ¿Olvidó su contraseña?
    </a>

</div>

</body>

</html>
