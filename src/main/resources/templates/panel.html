<!DOCTYPE html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Medical Data Gestión | Panel principal</title>

    <style>

        body {

            margin: 0;
            padding: 0;
            background: #e9eef5;
            font-family: Arial, Helvetica, sans-serif;

        }

        .contenedor {

            width: 90%;
            max-width: 1100px;
            margin: 40px auto;

        }

        .encabezado {

            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
            margin-bottom: 25px;

        }

        h1 {

            margin: 0;
            color: #1565C0;

        }

        .bienvenida {

            margin-top: 8px;
            color: #666666;

        }

        .menu {

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;

        }

        .tarjeta {

            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.12);
            text-align: center;

        }

        .tarjeta h2 {

            color: #1565C0;
            margin-top: 0;

        }

        .tarjeta p {

            color: #666666;
            min-height: 40px;

        }

        .boton {

            display: inline-block;
            padding: 10px 18px;
            background: #1976D2;
            color: white;
            text-decoration: none;
            border-radius: 6px;

        }

        .boton:hover {

            background: #0D47A1;

        }

        .cerrar {

            display: inline-block;
            margin-top: 25px;
            padding: 10px 18px;
            background: #C62828;
            color: white;
            text-decoration: none;
            border-radius: 6px;

        }

        .cerrar:hover {

            background: #8E0000;

        }

    </style>

</head>

<body>

<div class="contenedor">

    <div class="encabezado">

        <h1>
            Medical Data Gestión
        </h1>

        <p class="bienvenida">

            Bienvenido,
            <strong th:text="${usuario.nombre + ' ' + usuario.apellido}"></strong>

        </p>

        <p>

            Correo:
            <span th:text="${usuario.correo}"></span>

        </p>

        <p>

            Rol:
            <strong th:text="${usuario.rol}"></strong>

        </p>

    </div>

    <div class="menu">

        <!-- Solo ADMIN puede administrar usuarios. -->
        <div class="tarjeta"
             th:if="${administrador}">

            <h2>Usuarios</h2>

            <p>
                Administrar las cuentas de usuarios del sistema.
            </p>

            <a class="boton"
               th:href="@{/usuarios}">
                Ir a usuarios
            </a>

        </div>

        <!-- ADMIN y USUARIO pueden gestionar medicamentos. -->
        <div class="tarjeta">

            <h2>Medicamentos</h2>

            <p>
                Consultar y administrar los medicamentos registrados.
            </p>

            <a class="boton"
               th:href="@{/medicamentos}">
                Ir a medicamentos
            </a>

        </div>

        <div class="tarjeta">

            <h2>Perfil</h2>

            <p>
                Consultar la información del usuario actual.
            </p>

            <a class="boton"
               th:href="@{/perfil}">
                Ver perfil
            </a>

        </div>

    </div>

    <div style="text-align:center;">

        <a class="cerrar"
           th:href="@{/logout}">
            Cerrar sesión
        </a>

    </div>

</div>

</body>

</html>
