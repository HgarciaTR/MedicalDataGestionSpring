<!DOCTYPE html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Medical Data Gestión | Recuperar contraseña</title>

    <style>

        body {

            margin: 0;
            padding: 0;
            background: #e9eef5;
            font-family: Arial, Helvetica, sans-serif;

        }

        .contenedor {

            width: 420px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 0 18px rgba(0,0,0,0.18);

        }

        h1 {

            text-align: center;
            color: #1565C0;

        }

        p {

            text-align: center;
            color: #666666;

        }

        label {

            display: block;
            font-weight: bold;
            margin-bottom: 6px;

        }

        input[type=email] {

            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            box-sizing: border-box;

        }

        input[type=submit] {

            width: 100%;
            padding: 12px;
            background: #1976D2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;

        }

        input[type=submit]:hover {

            background: #0D47A1;

        }

        .error {

            margin-bottom: 18px;
            padding: 10px;
            background: #ffebee;
            color: #c62828;
            border-radius: 6px;
            text-align: center;

        }

        .volver {

            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1976D2;
            text-decoration: none;

        }

    </style>

</head>

<body>

<div class="contenedor">

    <h1>Recuperar contraseña</h1>

    <p>
        Ingrese el correo asociado a su cuenta.
    </p>

    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form th:action="@{/recuperar/verificar}"
          method="post">

        <label for="correo">
            Correo
        </label>

        <input type="email"
               id="correo"
               name="correo"
               placeholder="Ingrese su correo"
               required>

        <input type="submit"
               value="Continuar">

    </form>

    <a class="volver"
       th:href="@{/login}">
        Volver al inicio de sesión
    </a>

</div>

</body>

</html>
