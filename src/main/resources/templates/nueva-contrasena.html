<!DOCTYPE html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Medical Data Gestión | Nueva contraseña</title>

    <style>

        body {

            margin: 0;
            padding: 0;
            background: #e9eef5;
            font-family: Arial, Helvetica, sans-serif;

        }

        .contenedor {

            width: 420px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 0 18px rgba(0,0,0,0.18);

        }

        h1 {

            text-align: center;
            color: #1565C0;

        }

        p {

            text-align: center;
            color: #666666;

        }

        label {

            display: block;
            font-weight: bold;
            margin-bottom: 6px;

        }

        input[type=password] {

            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            box-sizing: border-box;

        }

        input[type=submit] {

            width: 100%;
            padding: 12px;
            background: #1976D2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;

        }

        input[type=submit]:hover {

            background: #0D47A1;

        }

    </style>

</head>

<body>

<div class="contenedor">

    <h1>Nueva contraseña</h1>

    <p>
        Escriba la nueva contraseña para su cuenta.
    </p>

    <form th:action="@{/recuperar/cambiar}"
          method="post">

        <input type="hidden"
               name="correo"
               th:value="${correo}">

        <label for="nuevaContrasena">
            Nueva contraseña
        </label>

        <input type="password"
               id="nuevaContrasena"
               name="nuevaContrasena"
               required>

        <input type="submit"
               value="Actualizar contraseña">

    </form>

</div>

</body>

</html>
