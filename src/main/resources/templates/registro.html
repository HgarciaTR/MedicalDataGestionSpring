<!DOCTYPE html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Medical Data Gestión | Registrarse</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            background: #e9eef5;
            font-family: Arial, Helvetica, sans-serif;
        }

        .contenedor {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.20);
        }

        h1 {
            text-align: center;
            color: #1565C0;
        }

        label {
            font-weight: bold;
        }

        input[type=text],
        input[type=email],
        input[type=password] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #cccccc;
            box-sizing: border-box;
        }

        input[type=submit] {
            width: 100%;
            padding: 12px;
            background: #1976D2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        input[type=submit]:hover {
            background: #0D47A1;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1976D2;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="contenedor">

    <h1>Crear cuenta</h1>

    <form th:action="@{/registro/guardar}"
          th:object="${usuario}"
          method="post">

        <label>Nombre:</label>

        <input type="text"
               th:field="*{nombre}"
               required>

        <label>Apellido:</label>

        <input type="text"
               th:field="*{apellido}"
               required>

        <label>Correo:</label>

        <input type="email"
               th:field="*{correo}"
               required>

        <label>Contraseña:</label>

        <input type="password"
               th:field="*{contrasena}"
               required>

        <input type="submit"
               value="Registrarse">

    </form>

    <a class="volver"
       th:href="@{/login}">
        Volver al inicio de sesión
    </a>

</div>

</body>

</html>
