<!DOCTYPE html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Medical Data Gestión | Medicamentos</title>

    <style>

        body{

            margin:0;
            padding:0;
            background:#e9eef5;
            font-family:Arial, Helvetica, sans-serif;

        }

        .contenedor{

            width:90%;
            max-width:1100px;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 15px rgba(0,0,0,0.20);

        }

        h1{

            text-align:center;
            color:#1565C0;

        }

        p{

            text-align:center;
            color:#555555;

        }

        .boton{

            display:inline-block;
            padding:10px 18px;
            background:#1976D2;
            color:white;
            text-decoration:none;
            border-radius:5px;
            margin-bottom:20px;
            margin-right:8px;

        }

        .boton:hover{

            background:#0D47A1;

        }

        table{

            width:100%;
            border-collapse:collapse;
            margin-top:10px;

        }

        th{

            background:#1976D2;
            color:white;
            padding:10px;

        }

        td{

            padding:10px;
            border:1px solid #dddddd;
            text-align:center;

        }

        tr:nth-child(even){

            background:#f4f7fb;

        }

        .editar{

            display:inline-block;
            padding:6px 10px;
            background:#1976D2;
            color:white;
            text-decoration:none;
            border-radius:4px;

        }

        .editar:hover{

            background:#0D47A1;

        }

        .eliminar{

            display:inline-block;
            padding:6px 10px;
            background:#C62828;
            color:white;
            text-decoration:none;
            border-radius:4px;
            margin-left:5px;

        }

        .eliminar:hover{

            background:#8E0000;

        }

    </style>

</head>

<body>

<div class="contenedor">

    <h1>Medical Data Gestión</h1>

    <p>
        Gestión de medicamentos registrados.
    </p>

    <!-- Navegación principal. -->
    <a class="boton" th:href="@{/panel}">
        Volver al panel
    </a>

    <!-- Botón para abrir el formulario de registro. -->
    <a class="boton" th:href="@{/medicamentos/nuevo}">
        Registrar medicamento
    </a>

    <table>

        <thead>

        <tr>

            <th>ID</th>
            <th>Nombre</th>
            <th>Fecha de vencimiento</th>
            <th>Descripción</th>
            <th>Usuario que registra</th>
            <th>Acciones</th>

        </tr>

        </thead>

        <tbody>

        <!-- Recorrer la lista de medicamentos enviada por el Controller. -->
        <tr th:each="medicamento : ${medicamentos}">

            <td th:text="${medicamento.idMedicamento}"></td>

            <td th:text="${medicamento.nombreMedicamento}"></td>

            <td th:text="${medicamento.fechaVencimiento}"></td>

            <td th:text="${medicamento.descripcion}"></td>

            <td th:text="${medicamento.usuario.nombre + ' ' + medicamento.usuario.apellido}"></td>

            <td>

                <!-- Enlace para editar el medicamento seleccionado. -->
                <a class="editar"
                   th:href="@{/medicamentos/editar/{id}(id=${medicamento.idMedicamento})}">
                    Editar
                </a>

                <!-- Enlace para eliminar el medicamento seleccionado. -->
                <a class="eliminar"
                   th:href="@{/medicamentos/eliminar/{id}(id=${medicamento.idMedicamento})}"
                   onclick="return confirm('¿Está seguro de eliminar este medicamento?');">
                    Eliminar
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
