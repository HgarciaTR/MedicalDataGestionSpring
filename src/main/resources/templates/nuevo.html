<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medical Data Gestión | Registrar medicamento</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #e9eef5;
            font-family: Arial, Helvetica, sans-serif;
        }

        .contenedor {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.20);
        }

        h1 {
            text-align: center;
            color: #1565C0;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #cccccc;
            box-sizing: border-box;
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #1976D2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
        }

        input[type="submit"]:hover {
            background: #0D47A1;
        }

        .volver {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #1976D2;
            text-decoration: none;
        }

        .usuario-activo {
            margin-bottom: 20px;
            padding: 12px;
            background: #f4f7fb;
            border-radius: 6px;
            color: #555555;
        }

        /* Estilos de los mensajes de advertencia. */
        .error {
            padding: 12px;
            margin-bottom: 20px;
            background: #FFEBEE;
            color: #C62828;
            border-radius: 5px;
        }

    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Registrar medicamento</h1>

        <!-- Información sobre el usuario que registra el medicamento. -->
        <div class="usuario-activo">
            El medicamento será registrado por el usuario que inició sesión.
        </div>

        <!-- Mostrar los mensajes de validación enviados por el Controller. -->
        <div class="error"
             th:if="${error != null}"
             th:text="${error}">
        </div>

        <!-- Formulario para registrar un medicamento mediante POST. -->
        <form th:action="@{/medicamentos/guardar}"
              th:object="${medicamento}"
              method="post">

            <!-- Campo para ingresar el nombre del medicamento. -->
            <label>Nombre del medicamento:</label>

            <input type="text"
                   th:field="*{nombreMedicamento}"
                   required>

            <!-- Campo para ingresar la fecha de vencimiento. -->
            <label>Fecha de vencimiento:</label>

            <input type="date"
                   th:field="*{fechaVencimiento}"
                   required>

            <!-- Campo para ingresar la descripción del medicamento. -->
            <label>Descripción:</label>

            <input type="text"
                   th:field="*{descripcion}">

            <!-- Botón para guardar el medicamento. -->
            <input type="submit"
                   value="Guardar medicamento">

        </form>

        <!-- Enlace para regresar al listado de medicamentos. -->
        <a class="volver" th:href="@{/medicamentos}">
            Volver a la lista
        </a>

    </div>

</body>
</html>
