# Configuración de la conexión con la base de datos MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/medicaldatagestion
spring.datasource.username=root
spring.datasource.password=1a2C4987.

# Configuración del controlador de MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA e Hibernate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de las páginas Thymeleaf.
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Mantener los nombres de las columnas tal como están definidos en MySQL.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl